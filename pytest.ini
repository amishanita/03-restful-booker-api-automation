[pytest]
addopts = -v --html=reports/pytest-html-report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: minimal set of checks that must pass on every run
    regression: full functional coverage
    negative: invalid input and error handling
    auth: authentication and authorisation
    crud: create, read, update, delete flows
    known_bug: documented deviation from the API specification

log_cli = false
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
